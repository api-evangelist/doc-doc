name: Doc Doc
description: Doc Doc (DOCDOC, Inc.) is a Latin American telemedicine platform offering online medical
  consultations by chat and video across more than 20 specialties, including pediatrics, gynecology,
  nutrition, psychology, cardiology, dermatology, orthopedics, and general practice. It serves individual
  patients, healthcare professionals, and companies running employee wellbeing programs, and delivers its
  consumer product through the app at app.doc-doc.com. As of this profile the company publishes no public
  developer API, documentation, or SDKs; enrichment found only the marketing site and the patient app.
